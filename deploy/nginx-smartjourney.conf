# Caddy 대신 Nginx 를 쓸 때 (인증서는 certbot --nginx 로)
#   sudo cp deploy/nginx-smartjourney.conf /etc/nginx/sites-available/smartjourney
#   sudo ln -s /etc/nginx/sites-available/smartjourney /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.smartjourney.example
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.smartjourney.example;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 1h;      # heartbeat 10초라 실제로는 끊기지 않음
        proxy_send_timeout 1h;
    }
}
