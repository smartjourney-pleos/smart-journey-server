spring:
  application:
    name: smart-journey-server
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 관리한다. 부팅 시 엔티티 ↔ 스키마 불일치를 바로 잡아낸다 (3-7)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

smartjourney:
  consent:
    # 고지 문구가 바뀌면 버전을 올린다. 차량 앱은 이 값으로 재동의 여부를 판단한다.
    current-version: "2026-11-v1"
    retention-days: 30
  auth:
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    pos-token-ttl: 12h
  qr:
    secret: ${QR_SECRET:local-dev-only-qr-secret-change-me-0123456789abcdef}
    ttl: 30m
  web:
    # CORS(POS 웹) + WebSocket 허용 Origin. 배포 시 POS 도메인 추가
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://10.0.2.2:*"
  demo:
    # POS 데모 패널(현장 대기 팀 +/-, 초기화) 허용 여부. 실제 매장 배포 시 false.
    enabled: true
  route:
    # none = 사용자가 고른 순서를 그대로 돌려줌 / kakao = 카카오모빌리티 소요시간으로 순서 최적화 (P1)
    provider: ${ROUTE_PROVIDER:none}
    kakao-rest-api-key: ${KAKAO_REST_API_KEY:}
  ops:
    # 운영 지표(KPI) API·대시보드 접근 토큰 (헤더 X-Ops-Token). 비어 있으면 KPI API 는 403
    token: ${OPS_TOKEN:}
