# 실제 PostgreSQL 사용 (클라우드 VM 배포, 또는 로컬에 PostgreSQL 을 직접 설치한 경우)
# 실행: SPRING_PROFILES_ACTIVE=postgres ./gradlew bootRun
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartjourney}
    username: ${DB_USERNAME:smartjourney}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/migration

smartjourney:
  demo:
    # 2차 PT·전시 기간엔 true (데모 패널), 실제 매장 운영 시 false
    enabled: ${DEMO_ENABLED:true}
  web:
    # POS 웹 배포 도메인 (쉼표로 여러 개). 예: https://pos.smartjourney.example,https://*.vercel.app
    allowed-origin-patterns: ${ALLOWED_ORIGINS:http://localhost:*}

server:
  # Caddy/Nginx 뒤에서 X-Forwarded-* 를 믿는다 (https 판단)
  forward-headers-strategy: framework

logging:
  level:
    com.smartjourney: INFO
